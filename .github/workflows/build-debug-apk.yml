# Builds a debug APK on every push, pull request and manual run.
# Download it from the run page: Actions -> "Debug APK" -> pick a run -> Artifacts.
name: Debug APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          NAME="Factonic-${VERSION}-debug-build${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### Factonic ${VERSION} - debug APK"
            echo ""
            echo "Download **${NAME}** from the *Artifacts* section below, unzip it and open the APK on your phone"
            echo "(allow installs from unknown sources). It installs over any earlier Factonic build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # The APK is already uploaded at this point, so a failing test never costs you the build.
      - name: Run the simulation tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests "com.factonic.game.SimTest"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14
